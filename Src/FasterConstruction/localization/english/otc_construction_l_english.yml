 setting_otc_construction_cost_minus_90_player_desc:0 "Buildings, new holdings and estate buildings cost a tenth. Gold stops being the limit on building. Only human players get this. AI rulers play by the normal rules. Stacks with the game's own cost discounts. Capped at 90%, for the same reason as Construction Time."
