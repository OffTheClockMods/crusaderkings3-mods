 rule_otc_construction_cost:0 "Construction Cost (Off the Clock)"
 setting_otc_construction_cost_default:0 "Default"
 setting_otc_construction_cost_default_desc:0 "[buildings|E] and new holdings cost the normal amount."
 setting_otc_construction_cost_minus_25_player:0 "#high -25% (cheaper), player only#!"
 setting_otc_construction_cost_minus_25_player_desc:0 "Buildings, new holdings and estate buildings cost 25% less gold (and prestige or piety where a building asks for it). Only human players get this. AI rulers play by the normal rules. Stacks with the game's own cost discounts. Capped at 90%, for the same reason as Construction Time."
