l_english:

 rule_otc_construction_time:0 "Construction Time (Off the Clock)"
 setting_otc_construction_time_default:0 "Default"
 setting_otc_construction_time_default_desc:0 "[buildings|E] and new holdings take the normal time to build."
 setting_otc_construction_time_minus_25_player:0 "#high -25% (faster), player only#!"
 setting_otc_construction_time_minus_25_player_desc:0 "Buildings, new holdings and estate buildings finish 25% sooner. Only human players get this. AI rulers play by the normal rules. Stacks with the game's own construction bonuses. Capped at 90%: the game adds all bonuses together, and we haven't proven what it does past 100%."
 otc_construction_time_minus_25_player:0 "Game Rule — Construction Time -25% (faster) (player)"
 setting_otc_construction_time_minus_50_player:0 "#high -50% (faster), player only#!"
 setting_otc_construction_time_minus_50_player_desc:0 "Buildings, new holdings and estate buildings take half the time. Only human players get this. AI rulers play by the normal rules. Stacks with the game's own construction bonuses. Capped at 90%: the game adds all bonuses together, and we haven't proven what it does past 100%."
 otc_construction_time_minus_50_player:0 "Game Rule — Construction Time -50% (faster) (player)"
 setting_otc_construction_time_minus_75_player:0 "#high -75% (faster), player only#!"
 setting_otc_construction_time_minus_75_player_desc:0 "Buildings, new holdings and estate buildings take a quarter of the time. Only human players get this. AI rulers play by the normal rules. Stacks with the game's own construction bonuses. Capped at 90%: the game adds all bonuses together, and we haven't proven what it does past 100%."
 otc_construction_time_minus_75_player:0 "Game Rule — Construction Time -75% (faster) (player)"
 setting_otc_construction_time_minus_90_player:0 "#high -90% (fastest), player only#!"
 setting_otc_construction_time_minus_90_player_desc:0 "Buildings, new holdings and estate buildings take a tenth of the time (a 3-year building takes about 4 months). Only human players get this. AI rulers play by the normal rules. Stacks with the game's own construction bonuses. Capped at 90%: the game adds all bonuses together, and we haven't proven what it does past 100%."
 otc_construction_time_minus_90_player:0 "Game Rule — Construction Time -90% (fastest) (player)"
 setting_otc_construction_time_minus_25_all:0 "#high -25% (faster), everyone#!"
 setting_otc_construction_time_minus_25_all_desc:0 "Buildings, new holdings and estate buildings finish 25% sooner. Every ruler gets this, AI included. Stacks with the game's own construction bonuses. Capped at 90%: the game adds all bonuses together, and we haven't proven what it does past 100%."
