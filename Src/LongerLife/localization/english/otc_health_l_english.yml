l_english:

 rule_otc_health:0 "Health (Off the Clock)"
 setting_otc_health_default:0 "Default"
 setting_otc_health_default_desc:0 "[health|E] is unchanged."
 setting_otc_health_minus_1_player:0 "#low -1 (harder), player only#!"
 setting_otc_health_minus_1_player_desc:0 "You get -1 health. Illness and early death come more often. A harder game. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_minus_1_player:0 "Game Rule — Health -1 (harder) (player)"
 setting_otc_health_plus_0_5_player:0 "#high +0.5, player only#!"
 setting_otc_health_plus_0_5_player_desc:0 "You get +0.5 health: a little less illness, a little longer life. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_plus_0_5_player:0 "Game Rule — Health +0.5 (player)"
 setting_otc_health_plus_1_player:0 "#high +1, player only#!"
 setting_otc_health_plus_1_player_desc:0 "You get +1 health: noticeably fewer deaths from illness and old age. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_plus_1_player:0 "Game Rule — Health +1 (player)"
 setting_otc_health_plus_2_player:0 "#high +2, player only#!"
 setting_otc_health_plus_2_player_desc:0 "You get +2 health: rulers often reach old age. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_plus_2_player:0 "Game Rule — Health +2 (player)"
 setting_otc_health_plus_3_player:0 "#high +3, player only#!"
 setting_otc_health_plus_3_player_desc:0 "You get +3 health: illness rarely kills. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_plus_3_player:0 "Game Rule — Health +3 (player)"
 setting_otc_health_plus_5_player:0 "#high +5, player only#!"
 setting_otc_health_plus_5_player_desc:0 "You get +5 health: very long lives. Heirs wait a long time. Only human players get this. AI rulers play by the normal rules. The game adds this to traits and other health effects."
 otc_health_plus_5_player:0 "Game Rule — Health +5 (player)"
 setting_otc_health_minus_1_all:0 "#low -1 (harder), everyone#!"
 setting_otc_health_minus_1_all_desc:0 "Every ruler get -1 health. Illness and early death come more often. A harder game. Every ruler gets this, AI included. The game adds this to traits and other health effects."
