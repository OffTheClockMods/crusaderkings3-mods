 setting_otc_stress_gain_minus_25_all_desc:0 "Every ruler gain 25% less stress from events and choices against their personality. Every ruler gets this, AI included. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
