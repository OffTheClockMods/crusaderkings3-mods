l_english:

 rule_otc_stress_gain:0 "Stress Gain (Off the Clock)"
 setting_otc_stress_gain_default:0 "Default"
 setting_otc_stress_gain_default_desc:0 "[stress|E] is gained at the normal rate."
 setting_otc_stress_gain_plus_50_player:0 "#low +50% (harder), player only#!"
 setting_otc_stress_gain_plus_50_player_desc:0 "You gain 50% more stress from events and choices. A harder game. Only human players get this. AI rulers play by the normal rules. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
 otc_stress_gain_plus_50_player:0 "Game Rule — Stress Gain +50% (harder) (player)"
 setting_otc_stress_gain_minus_25_player:0 "#high -25%, player only#!"
 setting_otc_stress_gain_minus_25_player_desc:0 "You gain 25% less stress from events and choices against your personality. Only human players get this. AI rulers play by the normal rules. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
 otc_stress_gain_minus_25_player:0 "Game Rule — Stress Gain -25% (player)"
 setting_otc_stress_gain_minus_50_player:0 "#high -50%, player only#!"
 setting_otc_stress_gain_minus_50_player_desc:0 "You gain half the stress. Mental breaks become rarer. Only human players get this. AI rulers play by the normal rules. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
 otc_stress_gain_minus_50_player:0 "Game Rule — Stress Gain -50% (player)"
 setting_otc_stress_gain_minus_75_player:0 "#high -75%, player only#!"
 setting_otc_stress_gain_minus_75_player_desc:0 "You gain a quarter of the stress. Acting against your traits is rarely a problem. Only human players get this. AI rulers play by the normal rules. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
 otc_stress_gain_minus_75_player:0 "Game Rule — Stress Gain -75% (player)"
 setting_otc_stress_gain_plus_50_all:0 "#low +50% (harder), everyone#!"
 setting_otc_stress_gain_plus_50_all_desc:0 "Every ruler gain 50% more stress from events and choices. A harder game. Every ruler gets this, AI included. Stops at -75%: the game adds all stress bonuses together (traits, difficulty), and we haven't proven what it does past -100%."
