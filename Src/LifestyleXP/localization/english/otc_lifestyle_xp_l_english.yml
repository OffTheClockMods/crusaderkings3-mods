l_english:

 rule_otc_lifestyle_xp:0 "Lifestyle Experience (Off the Clock)"
 setting_otc_lifestyle_xp_default:0 "Default"
 setting_otc_lifestyle_xp_default_desc:0 "[lifestyle_experience|E] is gained at the normal speed."
 setting_otc_lifestyle_xp_x0_5_player:0 "#low x0.5 (slower), player only#!"
 setting_otc_lifestyle_xp_x0_5_player_desc:0 "Lifestyle experience comes half as fast. Perks take about twice as long: a slower, harder game. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x0_5_player:0 "Game Rule — Lifestyle Experience x0.5 (slower) (player)"
 setting_otc_lifestyle_xp_x1_5_player:0 "#high x1.5, player only#!"
 setting_otc_lifestyle_xp_x1_5_player_desc:0 "Lifestyle experience comes 50% faster: a few more perks per lifetime. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x1_5_player:0 "Game Rule — Lifestyle Experience x1.5 (player)"
 setting_otc_lifestyle_xp_x2_player:0 "#high x2, player only#!"
 setting_otc_lifestyle_xp_x2_player_desc:0 "Lifestyle experience comes twice as fast: more of a perk tree fits into one lifetime. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x2_player:0 "Game Rule — Lifestyle Experience x2 (player)"
 setting_otc_lifestyle_xp_x3_player:0 "#high x3, player only#!"
 setting_otc_lifestyle_xp_x3_player_desc:0 "Lifestyle experience comes three times as fast. Most rulers finish a whole tree. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x3_player:0 "Game Rule — Lifestyle Experience x3 (player)"
 setting_otc_lifestyle_xp_x5_player:0 "#high x5, player only#!"
 setting_otc_lifestyle_xp_x5_player_desc:0 "Lifestyle experience comes five times as fast. Several trees per lifetime. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x5_player:0 "Game Rule — Lifestyle Experience x5 (player)"
 setting_otc_lifestyle_xp_x10_player:0 "#high x10, player only#!"
 setting_otc_lifestyle_xp_x10_player_desc:0 "Lifestyle experience comes ten times as fast. Long-lived rulers can finish most trees. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x10_player:0 "Game Rule — Lifestyle Experience x10 (player)"
 setting_otc_lifestyle_xp_x25_player:0 "#high x25, player only#!"
 setting_otc_lifestyle_xp_x25_player_desc:0 "Lifestyle experience comes 25 times as fast. Perks unlock every few months. Only human players get this. AI rulers play by the normal rules. The game adds this to the other lifestyle bonuses (traits, buildings, education), so the real speed also depends on those."
 otc_lifestyle_xp_x25_player:0 "Game Rule — Lifestyle Experience x25 (player)"
