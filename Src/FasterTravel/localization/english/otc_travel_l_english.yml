l_english:

 rule_otc_travel_speed:0 "Travel Speed (Off the Clock)"
 setting_otc_travel_speed_default:0 "Default"
 setting_otc_travel_speed_default_desc:0 "Characters [travel|E] at the normal [travel_speed|E]."
 setting_otc_travel_speed_plus_25_player:0 "#high +25%, player only#!"
 setting_otc_travel_speed_plus_25_player_desc:0 "Trips to feasts, hunts, pilgrimages and tournaments are a little shorter. Only human players get this. AI rulers play by the normal rules. Only characters traveling (activities, pilgrimages, court guests). Armies are not affected."
 otc_travel_speed_plus_25_player:0 "Game Rule — Travel Speed +25% (player)"
 setting_otc_travel_speed_plus_50_player:0 "#high +50%, player only#!"
 setting_otc_travel_speed_plus_50_player_desc:0 "Trips take about a third less time. Only human players get this. AI rulers play by the normal rules. Only characters traveling (activities, pilgrimages, court guests). Armies are not affected."
 otc_travel_speed_plus_50_player:0 "Game Rule — Travel Speed +50% (player)"
