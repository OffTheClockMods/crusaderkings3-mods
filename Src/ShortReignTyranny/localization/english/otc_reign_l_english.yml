 setting_otc_tyranny_minus_75_player_desc:0 "You gain a quarter of the tyranny. Only human players get this. AI rulers play by the normal rules. Stops at -90%, for the same reason as the short reign rule."
 otc_tyranny_minus_75_player:0 "Game Rule — Tyranny Gain -75% (player)"
 setting_otc_tyranny_minus_90_player:0 "#high -90%, player only#!"
 setting_otc_tyranny_minus_90_player_desc:0 "You gain almost no tyranny. Vassals rarely hate you for harsh acts. Only human players get this. AI rulers play by the normal rules. Stops at -90%, for the same reason as the short reign rule."
