 rule_otc_tyranny:0 "Tyranny Gain (Off the Clock)"
 setting_otc_tyranny_default:0 "Default"
 setting_otc_tyranny_default_desc:0 "[tyranny|E] is gained at the normal rate."
 setting_otc_tyranny_plus_50_player:0 "#low +50% (harder), player only#!"
 setting_otc_tyranny_plus_50_player_desc:0 "You gain 50% more tyranny from harsh acts. A harder game. Only human players get this. AI rulers play by the normal rules. Stops at -90%, for the same reason as the short reign rule."
 otc_tyranny_plus_50_player:0 "Game Rule — Tyranny Gain +50% (harder) (player)"
 setting_otc_tyranny_minus_25_player:0 "#high -25%, player only#!"
 setting_otc_tyranny_minus_25_player_desc:0 "You gain 25% less tyranny from imprisoning, revoking titles and other harsh acts. Only human players get this. AI rulers play by the normal rules. Stops at -90%, for the same reason as the short reign rule."
