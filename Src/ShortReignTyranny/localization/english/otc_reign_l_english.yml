l_english:

 rule_otc_short_reign:0 "Short Reign Duration (Off the Clock)"
 setting_otc_short_reign_default:0 "Default"
 setting_otc_short_reign_default_desc:0 "The [short_reign|E] penalty lasts the normal time."
 setting_otc_short_reign_plus_50_player:0 "#low +50% (harder), player only#!"
 setting_otc_short_reign_plus_50_player_desc:0 "The short reign penalty after a new ruler takes over lasts 50% longer. A harder game. Only human players get this. AI rulers play by the normal rules. Stops at -90%: the game adds these bonuses together, and we haven't proven what it does past -100%."
 otc_short_reign_plus_50_player:0 "Game Rule — Short Reign Duration +50% (harder) (player)"
 setting_otc_short_reign_minus_25_player:0 "#high -25%, player only#!"
 setting_otc_short_reign_minus_25_player_desc:0 "The short reign penalty after a new ruler takes over ends 25% sooner. Only human players get this. AI rulers play by the normal rules. Stops at -90%: the game adds these bonuses together, and we haven't proven what it does past -100%."
 otc_short_reign_minus_25_player:0 "Game Rule — Short Reign Duration -25% (player)"
 setting_otc_short_reign_minus_50_player:0 "#high -50%, player only#!"
 setting_otc_short_reign_minus_50_player_desc:0 "The short reign penalty ends in half the time. Only human players get this. AI rulers play by the normal rules. Stops at -90%: the game adds these bonuses together, and we haven't proven what it does past -100%."
