 setting_otc_domain_limit_plus_10_player:0 "#high +10, player only#!"
 setting_otc_domain_limit_plus_10_player_desc:0 "You can hold 10 more counties in your own domain. A big kingdom can be run mostly from the domain. Only human players get this. AI rulers play by the normal rules."
 otc_domain_limit_plus_10_player:0 "Game Rule — Domain Limit +10 (player)"
 setting_otc_domain_limit_plus_25_player:0 "#high +25, player only#!"
 setting_otc_domain_limit_plus_25_player_desc:0 "You can hold 25 more counties in your own domain. Most realms never reach the limit. Only human players get this. AI rulers play by the normal rules."
