 setting_otc_domain_limit_plus_1000_player:0 "#high +1000 (no practical limit), player only#!"
 setting_otc_domain_limit_plus_1000_player_desc:0 "You can hold practically every county on the map in your own domain. The game's separate penalty for holding too many duchies is unchanged. Only human players get this. AI rulers play by the normal rules."
 otc_domain_limit_plus_1000_player:0 "Game Rule — Domain Limit +1000 (no practical limit) (player)"
