 setting_otc_domain_limit_plus_50_player:0 "#high +50, player only#!"
 setting_otc_domain_limit_plus_50_player_desc:0 "You can hold 50 more counties in your own domain. An empire can be run with very few vassals. Only human players get this. AI rulers play by the normal rules."
