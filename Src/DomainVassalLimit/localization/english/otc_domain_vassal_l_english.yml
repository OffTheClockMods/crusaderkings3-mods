l_english:

 rule_otc_domain_limit:0 "Domain Limit (Off the Clock)"
 setting_otc_domain_limit_default:0 "Default"
 setting_otc_domain_limit_default_desc:0 "The [domain_limit|E] is unchanged. This rule adds to the game's own Domain Limit rule; use either or both."
 setting_otc_domain_limit_plus_2_player:0 "#high +2, player only#!"
 setting_otc_domain_limit_plus_2_player_desc:0 "You can hold 2 more counties in your own domain before the over-limit penalty starts. Only human players get this. AI rulers play by the normal rules."
 otc_domain_limit_plus_2_player:0 "Game Rule — Domain Limit +2 (player)"
 setting_otc_domain_limit_plus_5_player:0 "#high +5, player only#!"
 setting_otc_domain_limit_plus_5_player_desc:0 "You can hold 5 more counties in your own domain before the over-limit penalty starts. Only human players get this. AI rulers play by the normal rules."
