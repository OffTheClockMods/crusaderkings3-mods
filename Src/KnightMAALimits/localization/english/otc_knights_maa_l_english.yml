l_english:

 rule_otc_knight_limit:0 "Knight Limit (Off the Clock)"
 setting_otc_knight_limit_default:0 "Default"
 setting_otc_knight_limit_default_desc:0 "The number of [knights|E] is unchanged."
 setting_otc_knight_limit_plus_2_player:0 "#high +2, player only#!"
 setting_otc_knight_limit_plus_2_player_desc:0 "You can field 2 more knights in battle. Only human players get this. AI rulers play by the normal rules. Only adds slots: you still need courtiers and vassals who can fight."
 otc_knight_limit_plus_2_player:0 "Game Rule — Knight Limit +2 (player)"
